[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-evaluation"
version = "0.1.0"
description = "Independent safety evaluation runner (evaluation.v1)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sentinel-evaluation = "sentinel_evaluation.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
