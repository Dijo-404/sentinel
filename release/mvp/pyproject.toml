[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-release-mvp"
version = "0.1.0"
description = "Standalone MVP release-evidence verification kit (release-evidence.v1)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sentinel-release-mvp = "sentinel_release_mvp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
