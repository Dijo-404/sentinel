[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-knowledge"
version = "0.1.0"
description = "Independent knowledge.v1 articles and search service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "fastembed>=0.7,<1",
  "pgvector>=0.3,<1",
]

[project.scripts]
sentinel-knowledge = "sentinel_knowledge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_knowledge"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sentinel_knowledge",
  "contracts",
  "tests",
  "Makefile",
  "README.md",
  "CHANGELOG.md",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "postgres: real PostgreSQL + pgvector article store proofs",
  "real_embedder: downloads and runs the real local ONNX embedding model",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
