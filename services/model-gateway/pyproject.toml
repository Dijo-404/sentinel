[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-model-gateway"
version = "0.1.0"
description = "Sarvam-backed model gateway for workflow proposals and assistant replies"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
]

[project.scripts]
sentinel-model-gateway = "sentinel_model_gateway.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_model_gateway"]

[tool.hatch.build.targets.sdist]
include = ["src/sentinel_model_gateway", "tests", "Makefile", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel_model_gateway"]
