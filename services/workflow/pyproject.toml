[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-workflow"
version = "0.1.0"
description = "Independent durable LangGraph workflow worker (workflow.v1)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "SQLAlchemy>=2.0.44,<2.1",
  "psycopg[binary]>=3.2,<4",
  "langgraph>=0.2.60,<1",
  "langgraph-checkpoint-postgres>=2.0.0,<4",
]

[project.scripts]
sentinel-workflow = "sentinel_workflow.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
  "postgres: requires disposable Docker PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
