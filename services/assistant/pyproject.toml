[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-assistant"
version = "0.1.0"
description = "Independent assistant.v1 thread and message service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
postgres = [
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
sentinel-assistant = "sentinel_assistant.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_assistant"]

[tool.hatch.build.targets.sdist]
include = ["src/sentinel_assistant", "contracts", "tests", "Makefile", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel_assistant"]

