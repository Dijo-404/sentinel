[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-simulator"
version = "0.1.0"
description = "Deterministic synthetic payment-provider.v1 simulator with fault controls"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
sentinel-simulator = "sentinel_simulator.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx>=0.27,<1", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
