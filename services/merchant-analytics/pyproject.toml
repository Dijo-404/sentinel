[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-merchant-analytics"
version = "0.1.0"
description = "Independent merchant-analytics.v1 read-only aggregates service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
sentinel-merchant-analytics = "sentinel_merchant_analytics.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_merchant_analytics"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sentinel_merchant_analytics",
  "contracts",
  "fixtures",
  "tests",
  "Makefile",
  "README.md",
  "CHANGELOG.md",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
