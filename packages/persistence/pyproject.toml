[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-persistence"
version = "0.1.0"
description = "Optional tenant-aware PostgreSQL patterns and isolated synthetic migration checks"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2.0.44,<2.1", "alembic>=1.17,<2", "psycopg[binary]>=3.2,<4"]

[project.scripts]
sentinel-persistence = "sentinel_persistence.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
